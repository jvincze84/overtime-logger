services:
  overtime:
    build: .
    container_name: overtime
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Időzóna a mentések idejéhez és fájlnevéhez.
      TZ: ${TZ:-Europe/Budapest}
      # Túlóra szorzók százalékban.
      OVERTIME_RATE_EVENING: ${OVERTIME_RATE_EVENING:-150}
      OVERTIME_RATE_NIGHT: ${OVERTIME_RATE_NIGHT:-165}
      OVERTIME_RATE_RESTDAY: ${OVERTIME_RATE_RESTDAY:-200}
      OVERTIME_RATE_RESTDAY_NIGHT: ${OVERTIME_RATE_RESTDAY_NIGHT:-215}
      # Idősávok határai, 24 órás ÓÓ:PP formában.
      OVERTIME_NIGHT_END: "${OVERTIME_NIGHT_END:-06:00}"
      OVERTIME_WORK_START: "${OVERTIME_WORK_START:-08:30}"
      OVERTIME_WORK_END: "${OVERTIME_WORK_END:-17:00}"
      OVERTIME_NIGHT_START: "${OVERTIME_NIGHT_START:-22:00}"
    ports:
      # Csak erről a gépről érhető el. Hálózati eléréshez töröld a "127.0.0.1:" részt.
      - "8765:8000"
    volumes:
      - ./data:/data
